<div class="wrap">
  <site-breadcrumbs class="mb-2 sm:mb-3" [items]="crumbs()" />
  <h1 class="text-[24px] leading-[1.2] font-bold sm:text-[38px]">{{ title() }}</h1>
  @if (lead()) {
    <p
      class="mx-auto mt-2 max-w-[900px] text-[14px] leading-[1.7] font-light text-balance text-cream/75 sm:mt-3 sm:text-[16px]"
    >
      {{ lead() }}
    </p>
  }
  <ng-content />
</div>
