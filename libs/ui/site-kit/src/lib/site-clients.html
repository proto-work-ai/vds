<div
  class="grid grid-cols-2 items-center gap-x-6 gap-y-10 sm:grid-cols-3 sm:gap-x-10 lg:grid-cols-6"
>
  @for (client of clients(); track client.name) {
    <div class="flex h-24 items-center justify-center px-2">
      <img
        [src]="assets + client.logo"
        [alt]="client.name"
        loading="lazy"
        decoding="async"
        class="h-16 w-full object-contain"
      />
    </div>
  }
</div>
