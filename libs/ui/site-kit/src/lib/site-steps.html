<div
  class="absolute top-8 right-0 left-0 hidden h-px bg-[linear-gradient(90deg,transparent,var(--color-sand)_8%,var(--color-sand)_92%,transparent)] lg:block"
></div>
<ol class="grid grid-cols-1 gap-10 sm:grid-cols-2 lg:grid-cols-4 lg:gap-8">
  @for (s of steps(); track s.title; let i = $index) {
    <li class="text-center lg:text-left">
      <span
        class="relative z-10 mx-auto mb-6 flex size-16 items-center justify-center rounded-full border-2 border-gold font-serif text-[22px] font-semibold text-gold lg:mx-0"
        [class]="circle() === 'white' ? 'bg-white' : 'bg-cream'"
      >
        {{ (i + 1).toString().padStart(2, '0') }}
      </span>
      <h3 class="mb-2.5 text-[20px]">{{ s.title }}</h3>
      <p class="text-[14px] leading-relaxed text-slate/80">{{ s.text }}</p>
    </li>
  }
</ol>
