<img
  alt="Комната после"
  class="pointer-events-none absolute inset-0 size-full object-cover"
  draggable="false"
  [src]="assets + after()"
/>
<span
  class="absolute top-5 right-5 bg-gold px-3 py-1.5 text-[12px] tracking-[.2em] text-white uppercase"
>
  После
</span>
<img
  alt="Комната до"
  class="pointer-events-none absolute inset-0 size-full object-cover"
  draggable="false"
  [src]="assets + before()"
  [style.clip-path]="clip()"
/>
<span
  class="absolute top-5 left-5 bg-black/40 px-3 py-1.5 text-[12px] tracking-[.2em] text-white/70 uppercase backdrop-blur-sm transition-opacity duration-300"
  [style.opacity]="pos() > 12 ? 1 : 0"
>
  До
</span>
<div class="pointer-events-none absolute inset-y-0 -translate-x-1/2" [style.left.%]="pos()">
  <div class="mx-auto h-full w-px bg-white/60"></div>
  <div
    class="absolute top-1/2 left-1/2 flex size-10 -translate-1/2 items-center justify-center gap-0.5 rounded-full bg-gold text-white shadow-[0_0_0_4px_rgb(201_168_76/.28)]"
  >
    <svg
      width="10"
      height="10"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
    <svg
      width="10"
      height="10"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path d="m9 18 6-6-6-6" />
    </svg>
  </div>
</div>
