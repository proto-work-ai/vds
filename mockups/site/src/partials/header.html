<header class="site-header" data-header>
  <div class="wrap flex h-[72px] items-center justify-between gap-6">
    <a
      href="{{home}}"
      class="block w-[190px] shrink-0 text-white sm:w-[220px]"
      aria-label="Shtorivdom — на главную"
      ><!-- @logo-3 --></a
    >
    <nav class="hidden items-center gap-6 xl:gap-8 lg:flex" aria-label="Основное меню">
      <a href="{{home}}" class="nav-link" data-nav="">Главная</a>
      <div class="has-dropdown relative py-6">
        <a
          href="{{root}}catalog/"
          class="nav-link inline-flex items-center gap-1"
          data-nav="catalog/"
          aria-haspopup="true"
          >Каталог
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="m6 9 6 6 6-6" /></svg
        ></a>
        <div class="dropdown">
          <!-- @catalog-links --><span class="dropdown-sep" aria-hidden="true"></span
          ><a href="{{root}}calc/">Калькулятор штор</a><a href="{{root}}quiz/">Подбор штор</a>
        </div>
      </div>
      <a href="{{root}}price/" class="nav-link" data-nav="price/">Цены</a>
      <a href="{{root}}services/" class="nav-link" data-nav="services/">Услуги</a>
      <a href="{{root}}about/" class="nav-link" data-nav="about/">О нас</a>
      <a href="{{root}}partner/" class="nav-link" data-nav="partner/">Партнёрам</a>
      <a href="{{root}}contact/" class="nav-link" data-nav="contact/">Контакты</a>
    </nav>
    <div class="hidden items-center gap-5 lg:flex">
      <a
        href="tel:+79153591200"
        class="hidden text-[14px] font-bold whitespace-nowrap text-cream transition-colors hover:text-gold xl:block"
        >+7 (915) 359-12-00</a
      >
      <a href="#lead" class="btn-header">Заявка</a>
    </div>
    <div class="flex items-center gap-1 lg:hidden">
      <a
        href="tel:+79153591200"
        class="grid size-11 place-items-center text-gold"
        aria-label="Позвонить +7 (915) 359-12-00"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"
          />
        </svg>
      </a>
      <button
        type="button"
        class="burger px-2.5 py-3.5"
        aria-label="Открыть меню"
        aria-expanded="false"
        aria-controls="mobile-menu"
        data-burger
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <div id="mobile-menu" class="mobile-panel lg:hidden" data-mobile-menu>
    <div class="wrap pt-2 pb-6">
      <a href="{{home}}">Главная</a>
      <button type="button" class="m-toggle" aria-expanded="false" data-sub-toggle>
        Каталог
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <div class="m-sub" data-sub>
        <a href="{{root}}catalog/">Весь каталог</a
        ><!-- @catalog-links --><span class="dropdown-sep" aria-hidden="true"></span
        ><a href="{{root}}calc/">Калькулятор штор</a><a href="{{root}}quiz/">Подбор штор</a>
      </div>
      <a href="{{root}}price/">Цены</a>
      <a href="{{root}}services/">Услуги</a>
      <a href="{{root}}about/">О нас</a>
      <a href="{{root}}partner/">Партнёрам</a>
      <a href="{{root}}contact/">Контакты</a>
      <p class="mt-5 text-[14px] text-cream/70">10:00–20:00 / Без выходных</p>
      <a href="#lead" class="btn-gold mt-4 !flex !justify-center !border-0">Оставить заявку</a>
    </div>
  </div>
</header>
