<tui-textfield tuiChevron>
  <label tuiLabel>Select Entity</label>

  <input tuiComboBox formControlName="relationId" />

  <tui-data-list virtualScrollHost *tuiTextfieldDropdown>
    <cdk-virtual-scroll-viewport itemSize="35" appendOnly class="example-viewport">
      <button
        *cdkVirtualFor="let item of [] | virtualScrollPaginate: serviceSearch()"
        new
        tuiOption
        type="button"
        [value]="item"
        class="example-item"
      >
        {{ item }}
      </button>
    </cdk-virtual-scroll-viewport>
    <tui-loader />
  </tui-data-list>
</tui-textfield>
