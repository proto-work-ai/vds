  class="container mx-auto flex flex-col gap-5 max-sm:px-5 md:my-8 my-6"
>

  <div class="flex max-lg:flex-col bg-gray-light max-lg:bg-white">
    <section class="lg:w-4/7">
      <app-gallerize-images id="catalog-getail" [item]="item()"></app-gallerize-images>
    </section>

    <section class="flex-1 flex flex-col gap-3 p-5 gap-5">
      <header>
        <h2 class="text-2xl md:text-3xl">{{ title() }}</h2>
      </header>

      <p>
        {{ brief() }}
      </p>

      <!-- <section class="flex flex-col gap-3">
        <h4 class="text-xl">Преимущества</h4>

        <ul class="list-disc ms-5 flex flex-col gap-1">
          <li>Низкая цена</li>

          <li>Устойчивость к влаге</li>
          <li>Широкий цветовой диапазон</li>
        </ul>
      </section> -->

      <div class="mt-auto flex max-sm:flex-col gap-3">
        <app-price-card [item]="item()" size="l" />

        <footer class="sm:ms-auto sm:self-end">
          <button (click)="formSubmit()" class="btn-primary btn-sm max-sm:w-full" type="submit">
            <span class="px-10">Заказать</span>
          </button>
        </footer>
      </div>
    </section>
  </div>
</section>

<section class="max-md:px-4">
  <div class="container px-3 py-4 mx-auto z-1 bg-gray-light rounded-xl">
    <ol class="grid lg:grid-cols-4 grid-cols-2 gap-6">
      @for (item of items(); track item) {
        <li class="flex items-center gap-3">
          <div class="w-15 sm:w-20">
            <img [src]="item.src" class="w-full block" [alt]="item.title" />
          </div>
          <div class="flex-1 max-sm:text-sm">{{ item.title }}</div>
        </li>
      }
    </ol>
  </div>
</section>

<section class="container mx-auto max-sm:px-5 md:my-8 my-6">
  <router-outlet />
</section>

<app-social-buttons />

<!-- Price -->
<section class="container mx-auto max-sm:px-5 md:my-8 my-6">
  <header class="text-start flex flex-col gap-3 my-4">
    <h3 class="text-md md:text-xl uppercase font-semibold">Цены на натяжные потолки с учетом установки</h3>
  </header>

  <app-price-list-table [tableRows]="filtered()"></app-price-list-table>
</section>

<app-ceiling-calculator id="price-calculation" />

<app-way-we-work id="way-we-work"></app-way-we-work>

<app-application-measurement id="measurement" />

<app-footer-menu />
