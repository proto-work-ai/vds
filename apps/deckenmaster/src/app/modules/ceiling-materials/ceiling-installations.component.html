<div class="container mx-auto flex flex-col gap-5 max-sm:px-5 md:my-8 my-6">
  <header class="text-center flex flex-col gap-2 sm:gap-3">
    <h2 class="md:text-4xl text-2xl">Материалы полотна для натяжных потолков</h2>

    <div class="md:w-175 mx-auto text-gray-500">
      Предоставляем для заказчиков только проверенных производителей, которые зарекомендовали себя на рынке
    </div>
  </header>

  <section class="flex flex-col gap-5">
    <app-price-list-route-filter [groups]="groups()"></app-price-list-route-filter>

    <ol>
      @for (item of filtered(); track item) {
        <li class="border rounded-xl">
          <header class="flex justify-between">
            {{ item.title }}

          </header>

          <footer>

          </footer>
        </li>
      }
    </ol>

    <!-- @if (category() > 5) {
      <app-price-list-unit-table [tableRows]="filtered()"></app-price-list-unit-table>
    } @else {
      <app-price-list-brand-table [tableRows]="filtered()"></app-price-list-brand-table>
    } -->
  </section>
</div>
