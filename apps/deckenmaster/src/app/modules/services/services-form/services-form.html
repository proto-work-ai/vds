<form
  [formStore]="'draining-suspended-ceiling-form'"
  [formGroup]="form"
  (submit)="formSubmit()"
  class="flex flex-col gap-3 px-5 pt-5 pb-2 shadow-xl border border-gray-100 rounded-lg"
>
  <!-- <h3 class="text-lg font-medium text-center">Оставьте номер — мастер перезвонит в течение 5 минут.</h3> -->

  <section class="flex max-sm:flex-col gap-3">
    <tui-textfield [tuiTextfieldCleaner]="false" class="flex-1">
      <label tuiLabel>Ваше имя</label>
      <input tuiInput formControlName="name" />
    </tui-textfield>

    <tui-textfield [tuiTextfieldCleaner]="false" class="flex-1">
      <label tuiLabel>Укажите телефон</label>
      <input tuiInputPhone mask="+7 ### ###-##-##" formControlName="phone" />
    </tui-textfield>

    <div class="flex-1">
      <button class="btn-primary btn-sm w-full" type="submit">Отправить</button>
    </div>
  </section>

  <small>*Оставьте номер — мастер перезвонит в течение 5 минут</small>
</form>
