<div class="relative">
  <div class="bg-banner absolute w-full h-full top-0 left-0 z-[-1] max-sm:hidden"></div>

  <div class="lg:container mx-auto z-1 sm:px-5">
    <div class="flex sm:items-center max-sm:flex-col gap-3 sm:min-h-110">
      <section class="flex flex-col gap-5 max-w-[570px] pt-5">
        <div>
          <span class="badge">Москва и область</span>
        </div>

        <h1 class="font-medium max-lg:text-4xl/10 md:text-5xl/14">
          Слив воды с натяжных
          <br />потолков в Москве от 2490 руб./м2
        </h1>

        <p class="text-gray-700">
          Мы сливаем воду без проколов и повреждений — аккуратно.
          <br />
          Мастер приезжает в среднем за 20–60 минут и аккуратно восстанавливает потолок после затопления.
        </p>

        <!-- <app-services-form class="pb-4" /> -->
      </section>

      <section class="sm:ms-auto">
        <app-services-form class="block pb-4 sm:w-100" />
      </section>
    </div>
  </div>
</div>
