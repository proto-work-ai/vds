<div class="bg-banner">
  <div class="lg:container max-lg:px-3 mx-auto sm:h-120 z-1">
    <div class="sm:flex gap-3 md:gap-6 sm:py-12">
      <section class="flex-1 flex flex-col gap-5">
        <div></div>

        <div>
          <span class="badge">Москва и область</span>
        </div>

        <h1 class="-font-semibold max-lg:text-4xl/10 lg:text-5xl/14">Натяжные потолки <br />в Москве под ключ</h1>

        <p class="text-gray-600 pb-6 sm:w-100">
          Натяжные потолки любых видов и сложности. Поможем с выбором идеального варианта! Качественные материалы.
          Опытные мастера!
        </p>
      </section>

      <section class="bg-circle">
        <div class="circle hidden md:block"></div>
        <app-main-banner-form></app-main-banner-form>
      </section>
    </div>
  </div>
</div>

<div class="md:container max-lg:px-3 py-4 mx-auto z-1">
  <ol class="grid lg:grid-cols-4 grid-cols-2 gap-6">
    @for (item of items(); track item) {
      <li class="flex items-center gap-3">
        <div class="w-20">
          <img [src]="item.src" class="w-full block" [alt]="item.title" />
        </div>
        <div class="flex-1">{{ item.title }}</div>
      </li>
    }
  </ol>
</div>
