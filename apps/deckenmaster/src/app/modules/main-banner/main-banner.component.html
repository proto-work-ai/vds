<div class="container mx-auto h-120">
  <div class="flex gap-6 py-12">
    <section class="w-160 flex flex-col gap-5">
      <div></div>

      <div>
        <span class="badge">Москва и регионы</span>
      </div>

      <h1 class="font-semibold text-5xl/14 uppercase">Натяжные потолки <br />в Москве под ключ</h1>

      <p class="text-gray-600 w-100">
        Натяжные потолки любых видов и сложности. Поможем с выбором идеального варианта! Качественные материалы. Опытные
        мастера!
      </p>
    </section>

    <section class="flex-1"></section>

    <section>
      <form class="flex flex-col gap-6 p-5 text-white form-wrap">
        <h3 class="text-xl">Рассчитайте стоимость</h3>

        <tui-textfield>
          <label tuiLabel>Тип потолка</label>
          <input tuiTextfield [(ngModel)]="value" [ngModelOptions]="{standalone: true}" />
        </tui-textfield>

        <section>
          <tui-textfield>
            <label tuiLabel>Укажите площадь, м2</label>
            <input
              tuiInputSlider
              postfix=" м"
              [min]="minRange"
              [max]="maxRange"
              [(ngModel)]="range"
              [ngModelOptions]="{standalone: true}"
            />
            <input tuiSlider type="range" />
            <!-- <tui-icon tuiTooltip="Укажите площадь, м2" /> -->
          </tui-textfield>

          <div class="flex justify-between">
            @for (label of ticksLabels; track label) {
              <small>{{ label }}</small>
            }
          </div>
        </section>
        <!-- 
        <tui-textfield>
          <label tuiLabel>Укажите площадь, м2</label>
          <input tuiTextfield [(ngModel)]="value" [ngModelOptions]="{standalone: true}" />
        </tui-textfield> -->

        <tui-textfield>
          <label tuiLabel>Укажите телефон</label>
          <input tuiTextfield [(ngModel)]="value" [ngModelOptions]="{standalone: true}" />
        </tui-textfield>

        <button class="btn-primary btn-sm">Получить предложение</button>
      </form>
    </section>
  </div>
</div>
