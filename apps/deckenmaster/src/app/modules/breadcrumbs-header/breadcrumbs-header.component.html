<section class="border-b-1 border-gray-200">
  <ol class="lg:container max-lg:px-3 mx-auto flex items-center py-2">
    <li class="flex-1">
      <nav class="flex items-center gap-1">
        @for (item of items(); track item) {
          @if (item.link) {
            <a [routerLink]="item.link">{{ item.title }}</a>

            <ng-icon name="lucideChevronRight" size="1.25em" strokeWidth="1px"></ng-icon>
          } @else {
            <span class="text-gray-500 truncate max-sm:max-w-65">{{ item.title }}</span>
          }
        }
      </nav>
    </li>
  </ol>
</section>
