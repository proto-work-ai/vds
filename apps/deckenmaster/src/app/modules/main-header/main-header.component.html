<div class="bg-black -sticky -top-0 z-50 px-3">
  <header class="lg:container mx-auto text-white">
    <nav>
      <ol class="flex items-center gap-6 py-1">
        <li>
          <!-- <ng-icon hlm name="lucideChevronDown" class="ml-auto" /> -->

          <a [routerLink]="['/']" class="block max-sm:hidden"><img class="w-40" src="/logo/logo-text-light.svg" /></a>

          <a [routerLink]="['/']" class="hidden max-sm:block py-2"
            ><img class="w-8" src="/logo/logo-icon-light.svg" alt="Logotip"
          /></a>
        </li>

        <li class="flex-1"></li>

        <li class="flex gap-4">
          <a href="https://t.me/{{ telegramContact }}" target="_blank" title="Telegram"
            ><img class="w-6 max-sm:w-5 max-sm:w-5 block text-white" src="/icons/telegram-light.svg" alt="Telegram"
          /></a>

          <a [href]="maxContact" target="_blank"
            ><img class="w-6 max-sm:w-5 max-sm:w-5 block" title="Max" src="/icons/max-icon-light.svg" alt="Max"
          /></a>
        </li>

        <li>
          <!-- <a href="javascript:void(0)" class="text-xs">Заказать звонок</a> -->

          <div class="flex items-center gap-2">
            <ng-icon name="lucidePhone" class="text-white" />
            <a class="max-sm:text-sm" href="tel:+7{{ phoneContact }}">{{ phoneContact | phoneFormat }}</a>
          </div>
        </li>
      </ol>
    </nav>
  </header>
</div>
