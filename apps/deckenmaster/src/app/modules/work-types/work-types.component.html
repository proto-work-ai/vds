<div class="container mx-auto flex flex-col gap-5 my-8">
  <header class="text-center flex flex-col gap-3">
    <h2 class="text-4xl -font-bold">{{ title() }}</h2>

    <div class="w-175 mx-auto text-gray-500">
      От классики до сложных дизайнерских решений. Гарантируем быстрое производство,
       профессиональный монтаж, бесплатный замер.
    </div>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    @for (item of items(); track item) {
      <article class="flex flex-col bg-gray-light">
        <figure class="h-60 w-full bg-image -aspect-1/1" [style.background-image]="'url(' + item.src + ')'">
          <img class="hidden" [attr.src]="item.src" [attr.alt]="item.title" />
        </figure>

        <footer class="p-3 flex flex-col gap-2">
          <h4 class="uppercase font-medium">{{ item.title }}</h4>

          <p class="text-sm">{{ item.text }}</p>
        </footer>
      </article>
    }
  </div>
</div>
