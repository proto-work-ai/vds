<article class="flex flex-col bg-gray-light h-full max-md:max-w-100">
  <figure class="w-full bg-image aspect-1.5/1" [style.background-image]="'url(' + item()?.image + ')'">
    @if (item(); as item) {
      <img class="hidden" [attr.src]="item.image" [attr.alt]="item.title" />
    }
  </figure>

  <section class="p-3 flex flex-col gap-3 h-full">
    <footer class="flex flex-col gap-2">
      <h4 class="uppercase font-medium">{{ title() }}</h4>

      <p class="text-sm">{{ brief() }}</p>
    </footer>

    <section class="flex flex-col mt-auto w-full">
      <app-price-card size="s" [item]="item()"></app-price-card>
      <!-- <div class="flex gap-1 justify-end">
        <div class="text-sm">Цена:</div>
        <div class="text-sm">
          от
          <span class="font-semibold">{{ price() }} </span>
          руб/м²
        </div>
      </div> -->
    </section>
  </section>
</article>
