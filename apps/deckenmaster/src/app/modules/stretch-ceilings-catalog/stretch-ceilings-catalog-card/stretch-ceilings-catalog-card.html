<article class="flex flex-col bg-gray-light max-md:max-w-100">
  <figure class="w-full bg-image aspect-1.5/1" [style.background-image]="'url(' + item()?.image + ')'">
    @if (item(); as item) {
      <img class="hidden" [attr.src]="item.image" [attr.alt]="item.title" />
    }
  </figure>

  <footer class="p-3 flex flex-col gap-2">
    <h4 class="uppercase font-medium">{{ item()?.title }}</h4>

    <p class="text-sm">{{ item()?.brief }}</p>
  </footer>
</article>
