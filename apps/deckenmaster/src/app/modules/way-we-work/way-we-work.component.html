<div class="container mx-auto">
  <header class="text-center my-5">
    <h2 class="text-bold text-3xl font-bold">{{title()}}</h2>
  </header>

  <div class="way-we-work">
    <div class="flex flex-col">
      @for (item of items; track item; let odd = $odd; let index = $index) {
        <article class="block-item">
          <div class="w-1/2 px-8" [class.ms-auto]="odd" [attr.data-num]="index + 1">
            <h4>{{ item.title }}</h4>
            <p>{{ item.text }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</div>
