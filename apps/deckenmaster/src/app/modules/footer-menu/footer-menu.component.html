<div class="bg-dark-knight">
  <div class="md:container max-md:px-5 mx-auto text-white">
    <div class="flex max-sm:flex-col gap-6 pt-5 pb-4">
      <section class="flex">
        <div class="flex-1">
          <a [routerLink]="['/']"><img class="w-6" src="/logo/logo-icon-light.svg" /></a>
        </div>

        <div class="sm:hidden">
          <ng-container [ngTemplateOutlet]="sociallaLink"></ng-container>
        </div>
      </section>

      <section class="md:w-1/4 w-1/2 flex flex-col gap-3">
        <h4 class="text-md">Контакты</h4>

        <div class="flex items-center gap-2">
          <ng-icon name="lucidePhone" class="text-white" />
          <a class="max-sm:text-sm" href="tel:+7{{ phoneContact }}">{{ phoneContact | phoneFormat }}</a>
        </div>

        <a href="mailto:info@deckenmaster.ru">{{ 'Info@deckenmaster.ru' }}</a>

        <div class="text-xs">
          {{ periodContact }}. ООО «DeckenMaster» - Установка натяжных потолков в Москве и области.
        </div>
      </section>

      <section class="flex-1 flex flex-col gap-3">
        <h4 class="text-md">Меню</h4>

        <ol>
          <li><a href="javascript:void(0)">О компании</a></li>
          <li><a href="javascript:void(0)">Акции</a></li>
          <li><a href="javascript:void(0)">Наши работы</a></li>
          <li><a href="javascript:void(0)">Отзывы</a></li>
        </ol>
      </section>

      <div class="sm:block hidden">
        <ng-container [ngTemplateOutlet]="sociallaLink"></ng-container>
      </div>
    </div>
  </div>
</div>

<ng-template #sociallaLink>
  <div class="flex gap-2">
    <a class="max-sm:text-sm" href="https://t.me/{{ telegramContact }}" target="_blank" title="Telegram"
      ><img class="w-6 block text-white" src="/icons/telegram-light.svg"
    /></a>

    <a class="max-sm:text-sm" [href]="maxContact" target="_blank"
      ><img class="w-6 block" title="Max" src="/icons/max-icon-light.svg"
    /></a>
  </div>
</ng-template>
