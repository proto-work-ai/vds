<div class="container mx-auto">
  <div class="flex gap-x-5">
    <section class="flex-1 flex items-bottom justify-center bg-gray">
      <figure class="w-1/2"></figure>
    </section>

    <section class="flex-1 flex flex-col gap-3 py-8">
      <h3 class="text-3xl uppercase font-bold">{{ title() }}</h3>

      <div class="flex flex flex-col gap-3">
        <tui-textfield class="w-1/2">
          <label tuiLabel>Введите имя</label>
          <input tuiTextfield [(ngModel)]="value" />
        </tui-textfield>

        <div>
          <button class="btn-primary btn-sm">Заказать</button>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <h3 class="uppercase text-2xl">Выгода бесплатного замера</h3>

        <ol>
          <li>Точность замера помещения</li>
          <li>Гарантия верной цены, с применением скидок</li>
          <li>Помощь в выборе материалов и дизайна</li>
          <li>Техническая консультация специалиста</li>
          <li>В дальнейшем - безупречный монтаж</li>
        </ol>
      </div>
    </section>
  </div>
</div>
