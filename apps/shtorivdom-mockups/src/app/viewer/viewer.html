@if (mockup(); as current) {
  <main class="viewer">
    <header class="viewer__bar">
      <a routerLink="/" aria-label="Вернуться к каталогу мокапов">← Все мокапы</a>
      <strong>{{ current.title }}</strong>
      <a target="_blank" rel="noreferrer" [href]="source()">Открыть отдельно ↗</a>
    </header>
    <iframe [src]="source()" [title]="current.title"></iframe>
  </main>
} @else {
  <main class="missing">
    <h1>Мокап не найден</h1>
    <a routerLink="/">Вернуться к каталогу</a>
  </main>
}
