  <tui-textfield virtualScrollHost tuiChevron [stringify]="[] | virtualScrollPaginate: serviceSearch() | stringifySetter: 'title'">
    <label tuiLabel for="relation-id">Select Entity</label>

    <input id="relation-id" tuiComboBox formControlName="relationId" />

    <tui-data-list *tuiTextfieldDropdown>
      <cdk-virtual-scroll-viewport itemSize="35" appendOnly class="example-viewport">
        <button
          *cdkVirtualFor="let item of [] | virtualScrollPaginate: serviceSearch()"
          new
          tuiOption
          type="button"
          class="example-item"
          [value]="item.id"
        >
          {{ item.title }}
        </button>
      </cdk-virtual-scroll-viewport>
      <tui-loader />
    </tui-data-list>
  </tui-textfield>
