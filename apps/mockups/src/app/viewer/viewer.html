@if (mockup(); as current) {
  <main class="viewer">
    <header class="viewer__bar">
      <a routerLink="/" aria-label="Вернуться к каталогу мокапов">← Все мокапы</a>
      <strong>{{ current.title }}</strong>
      @if (source(); as src) {
        <a target="_blank" rel="noreferrer" [href]="src">Открыть отдельно ↗</a>
      }
    </header>
    @if (source(); as src) {
      <iframe [src]="src" [title]="current.title"></iframe>
    } @else {
      <p class="missing">Статический исходник этого мокапа отсутствует в архиве.</p>
    }
  </main>
} @else {
  <main class="missing">
    <h1>Мокап не найден</h1>
    <a routerLink="/">Вернуться к каталогу</a>
  </main>
}
