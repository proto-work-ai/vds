<form tuiForm [formGroup]="form" (submit)="formSubmit()">
  <section tuiForm>
    @for (attr of attributes! | sortBy: 'order'; track $index) {
    <ng-container
      [cdkPortalOutlet]="attr | fieldAttributePortal: model"
    ></ng-container>
    }
  </section>

  <footer>
    <button hlmBtn variant="outline" (click)="modalClose()">Cancel</button>

    <button hlmBtn type="submit">Submit</button>
  </footer>
</form>
