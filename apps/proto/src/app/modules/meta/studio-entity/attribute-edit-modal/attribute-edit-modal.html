<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
<form tuiForm [formGroup]="form" (submit)="formSubmit()">
  <tui-textfield>
    <label tuiLabel>Title</label>
    <input formControlName="title" tuiTextfield />
  </tui-textfield>

  <tui-textfield>
    <label tuiLabel>Name</label>
    <input formControlName="name" tuiTextfield />
  </tui-textfield>

  <tui-textfield tuiChevron [content]="content">
    <label tuiLabel>Type</label>

    <input tuiComboBox formControlName="type" placeholder="Select Type" />

    <ng-template #content let-value>
      @if(attrTypeList() | keyListValue: 'type':value; as item){
      <div class="flex items-center gap-2">
        <ng-icon hlm size="md" [name]="item.icon" />
        {{ item.title }}
      </div>
      }
    </ng-template>

    <tui-data-list *tuiTextfieldDropdown>
      @for (item of attrTypeList(); track $index) {
      <button new tuiOption type="button" [value]="item.type">
        <span class="flex gap-2">
          <ng-icon size="md" [name]="item.icon" />
          {{ item.title }}
        </span>
      </button>
      }
    </tui-data-list>
  </tui-textfield>

  <tui-textfield>
    <label tuiLabel>Description</label>
    <textarea formControlName="description" tuiTextarea></textarea>
  </tui-textfield>

  <label tuiLabel>
    <input tuiCheckbox type="checkbox" size="m" formControlName="readonly" />
    Readonly
  </label>

  <label tuiLabel>
    <input tuiCheckbox type="checkbox" size="m" formControlName="disable" />
    Disable
  </label>

  <footer>
    <!-- <button
      appearance="secondary"
      tuiButton
      type="button"
      size="m"
      (click)="modalClose()"
    >
      Cancel
    </button> -->

    <button variant="outline" hlmBtn (click)="modalClose()">Cancel</button>

    <!--     <button tuiButton type="submit" size="m">Submit</button> -->
    <button hlmBtn type="submit">Submit</button>
  </footer>
</form>
