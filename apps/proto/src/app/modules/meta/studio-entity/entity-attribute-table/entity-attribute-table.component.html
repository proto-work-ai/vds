<!-- <header class="flex items-center justify-between px-4 h-10 border-b"></header> -->

<section class="p-3">
  <header class="flex gap-2 flex-1 my-2 items-center">
    <div class="flex-1 flex gap-2 items-center">
      <a
        hlmBtn
        size="icon"
        variant="ghost"
        class="size-9"
        [routerLink]="['../..', 'entities']"
      >
        <ng-icon hlm size="md" name="lucideChevronLeft"></ng-icon>
      </a>

      <span class="font-medium">{{ metaEntity()?.title }}</span>
    </div>

    <div class="flex gap-2">
      <button variant="outline" hlmBtn (click)="openEditModal()">
        Add Attribute
      </button>

      <!-- <div class="flex-1"></div> -->

      <button hlmBtn size="icon" variant="outline">
        <ng-icon hlm size="sm" name="lucideRefreshCcw"></ng-icon>
      </button>

      <atlas-data-table-toggle-size></atlas-data-table-toggle-size>
    </div>
  </header>

  <atlas-taiga-ui-table
    [tableRows]="[] | atlasTablePaginate: attributeServiceAll()"
    [tableColumns]="columns()"
    (tableRowClick)="openEditModal($any($event))"
  ></atlas-taiga-ui-table>
</section>
