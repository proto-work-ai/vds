<div class="container mx-auto flex flex-col gap-8 my-12">
  <!-- <header class="text-center flex flex-col gap-2 sm:gap-3">
    <h2 class="mx-auto md:text-2xl text-xl w-150">Закажите бесплатный выезд дизайнера-замерщика в любой район Москвы и МО</h2>
  </header> -->

  <section class="mx-auto">
    <div class="flex gap-8">
      <div class="flex-1 flex flex-col gap-10">
        <h3 class="font-medium text-5xl">Запишитесь на посещение шоурума и получите промокод на скидку 10%</h3>

        <p>Мы сохраним личный промокод за вашим телефоном. Сообщите промокод менеджерам по телефону или в шоуруме</p>
      </div>

      <div class="flex-1">
        <form
          [formStore]="'main-application-measurement'"
          class="flex flex-col gap-8 -textfield-no-border"
          [formGroup]="form"
          (submit)="formSubmit()"
        >
          <tui-textfield [tuiTextfieldCleaner]="false">
            <label tuiLabel>Укажите телефон</label>
            <input tuiInputPhone formControlName="phone" mask="+7(###)###-##-##" />
          </tui-textfield>

          <tui-textfield [tuiTextfieldCleaner]="false">
            <label tuiLabel>Комментарий</label>
            <textarea tuiTextarea formControlName="description"></textarea>
          </tui-textfield>

          <label tuiLabel class="text-sm">
            <input tuiCheckbox type="checkbox" formControlName="checked" />
            <small class="text-sm">
              Я даю свое согласие на обработку персональных данных и соглашаюсь с условиями
              <a class="cursor-pointer">политики конфиденциальности</a>
            </small>
          </label>

          <footer>
            <button class="btn btn-primary w-full">Заказать</button>
<!-- 
            <button size="l" tuiButton type="button" class="block w-full">Заказать</button>

            <button size="m" tuiButton type="button" class="block w-full">Заказать</button> -->
          </footer>
        </form>
      </div>
    </div>
  </section>
</div>
