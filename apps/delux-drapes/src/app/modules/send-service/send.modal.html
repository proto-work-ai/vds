<form [formGroup]="form" (submit)="formSubmit()" class="flex flex-col gap-5">
  @defer {
    <tui-textfield [tuiTextfieldCleaner]="false">
      <label tuiLabel>Укажите телефон</label>
      <input tuiInputPhone formControlName="phone" mask="+7(###)###-##-##" />
    </tui-textfield>
  } @placeholder {
    <tui-textfield [tuiTextfieldCleaner]="false">
      <label tuiLabel>Укажите телефон</label>
      <input tuiInputPhone formControlName="phone" mask="+7(###)###-##-##" />
    </tui-textfield>
  }

  <label tuiLabel class="text-sm">
    <input tuiCheckbox type="checkbox" formControlName="checked" />
    <small class="text-sm">
      Я соглашаюсь с правилами по обработке
      <a class="cursor-pointer underline" [routerLink]="['/privacy-policy']" target="_blank">персональных данных</a>
    </small>
  </label>

  <footer class="flex gap-3 justify-end">
    <button class="flex-1" tuiButton (click)="formCancel()" appearance="outline-grayscale">Отмена</button>
    <button class="flex-1" tuiButton type="submit">Отправить</button>
  </footer>
</form>
