<article class="flex">
  <figure class="w-1/2 aspect-1/1" [style.background-image]="'url(' + item()?.src + ')'">
    @if (item(); as item) {
      <img class="hidden" [attr.src]="item.src" [attr.alt]="item.title" />
    }
  </figure>

  <div class="w-1/2 flex flex-col gap-4 bg-white-chocolate p-4">
    <h4 class="text-2xl">{{ item()?.title }}</h4>

    <ol class="flex-1 flex flex-col gap-5">
      <li class="flex justify-between">
        <span>Площадь</span>
        <span>{{ item()?.size }}</span>
      </li>

      <li class="flex justify-between">
        <span>Цвет</span>
        <span>{{ item()?.color }}</span>
      </li>

      <li class="flex justify-between">
        <span>Марка полотна </span>
        <span>{{ item()?.canvas }}</span>
      </li>

      <li class="flex justify-between">
        <span>Фактура</span>
        <span>{{ item()?.texture }}</span>
      </li>

      <li class="font-bold text-2xl text-price">{{ item()?.price }} Руб.</li>

      <li class="flex-1"></li>

      <li class="font-bold text-2xl">
        <button class="btn-primary w-full flex gap-3 items-center justify-center">
          Подробнее
          <ng-icon name="lucideCircleArrowRight" class="text-lg"/>
        </button>
      </li>
    </ol>
  </div>
</article>
