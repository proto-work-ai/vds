<div class="container mx-auto my-10 flex flex-col gap-4">
  <header class="text-center flex flex-col gap-2 sm:gap-3">
    <h2 class="md:text-4xl text-3xl">Наша Команда</h2>

    <div class="md:w-175 mx-auto text-gray-500">Талантливые мастера, создающие для вас шедевры</div>
  </header>

  <section class="grid lg:grid-cols-4 md:grid-cols-2 grid-cols-1 gap-4 mx-auto">
    @for (item of [1, 2, 3, 4]; track item) {
      <article class="flex flex-col gap-3">
        <figure class="aspect-3/4 rounded-lg overflow-hidden">
          <img src="/users/user-1.jpg" alt="" class="block" />
        </figure>

        <div class="text-center flex flex-col gap-2">
          <span>Елена Амеличкина</span>
          <span>Руководитель Студии</span>
        </div>
      </article>
    }
  </section>
</div>
