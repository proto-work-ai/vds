<div class="container mx-auto my-8 flex flex-col gap-4">
  <section class="flex flex-col gap-4">
    <header class="text-center flex flex-col gap-2 sm:gap-3">
      <h2 class="md:text-4xl text-2xl">Каталог Штор</h2>

      <div class="md:w-175 mx-auto text-gray-500">
        Вся продукция изготавливается по индивидуальным размерам из качественных материалов.
      </div>
    </header>

    <section class="grid lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-4 mx-auto">
      @for (item of CATALOG; track $index) {
        <a class="flex flex-col gap-3" [routerLink]="['/catalog', item.key]">
          <picture>
            <img [attr.src]="item.image" />
          </picture>

          <div class="text-xl font-medium">{{ item.title }}</div>

          <p>{{ item.text }}</p>
        </a>
      }
    </section>
  </section>
</div>
