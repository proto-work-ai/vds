<form
  [formStore]="'draining-suspended-ceiling-form'"
  [formGroup]="form"
  (submit)="formSubmit()"
  class="flex flex-col gap-3 px-5 pt-5 pb-3 shadow-xl border border-gray-100 rounded-lg bg-white"
>
  <h3 class="text-2xl font-medium text-center">Оставьте номер телефона</h3>

  <section class="flex flex-col gap-3">
    <tui-textfield [tuiTextfieldCleaner]="false" class="flex-1">
      <label tuiLabel>Ваше имя</label>
      <input tuiInput formControlName="name" [maxlength]="100" />
    </tui-textfield>

    @defer {
      <tui-textfield [tuiTextfieldCleaner]="false">
        <label tuiLabel>Укажите телефон</label>
        <input tuiInputPhone formControlName="phone" mask="+7(###)###-##-##" />
      </tui-textfield>
    } @placeholder {
      <tui-textfield [tuiTextfieldCleaner]="false">
        <label tuiLabel>Укажите телефон</label>
        <input tuiInputPhone formControlName="phone" mask="+7(###)###-##-##" />
      </tui-textfield>
    }

    <label tuiLabel class="text-sm">
      <input tuiCheckbox type="checkbox" formControlName="checked" />
      <small class="text-sm">
        Я соглашаюсь с правилами по обработке <a class="cursor-pointer underline" >персональных данных</a>
      </small>
    </label>

    <div class="flex-1">
      <button class="btn-primary w-full" type="submit">Отправить</button>
    </div>
  </section>

  <small>*Мастер перезвонит в течение 5 минут</small>
</form>
