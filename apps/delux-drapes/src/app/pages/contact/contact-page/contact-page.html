<app-main-header></app-main-header>

<app-breadcrumbs-header [items]="breadcrumbs()" />

<div class="container mx-auto my-10 flex flex-col gap-4">
  <header class="text-center flex flex-col gap-2 sm:gap-3">
    <h2 class="md:text-4xl text-3xl">Контакты</h2>
  </header>

  <div class="flex max-md:flex-col gap-6">
    <section class="flex-1 grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-3">
        <h4 class="font-medium text-xl">Адрес</h4>
        <a
          [attr.href]="addressLink"
          target="_blank"
          class="underline decoration-dashed flex gap-1 items-center cursor-pointer"
          >{{ address }}</a
        >
      </div>

      <div class="flex flex-col gap-3">
        <h4 class="font-medium text-xl">Метро</h4>
        <p>Чкаловская — 860 м</p>
      </div>

      <div class="flex flex-col gap-3">
        <h4 class="font-medium text-xl">График работы</h4>

        <ul>
          <li>пн-чт : c 10.00 до 20.00</li>
          <li>пт-сб : с 10.00 до 18.00</li>
        </ul>
      </div>

      <div class="flex flex-col gap-3">
        <h4 class="font-medium text-xl">Телефон</h4>

        <ol>
          <li>
            <a href="tel:+7{{ phoneContact }}">{{ phoneContact | phoneFormat }}</a>
          </li>
          <!-- <li><a href="tel:+7{{ phoneContact }}">{{ phoneContact | phoneFormat }}</a></li> -->
        </ol>
      </div>

      <div class="flex flex-col gap-3">
        <h4 class="font-medium text-xl">Социальные сети</h4>

        <div class="flex gap-2">
          <a class="max-sm:text-sm" href="https://t.me/{{ telegramContact }}" target="_blank" alt="Telegram"
            ><img class="w-6 block text-white" src="/icons/telegram.svg" alt="Logotip"
          /></a>

          <a class="max-sm:text-sm" [href]="maxContact" target="_blank"
            ><img class="w-6 block" title="Max" src="/icons/max.svg" alt="Max"
          /></a>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <h4 class="font-medium text-xl">Эл. почта</h4>
        <a class="max-sm:text-sm" href="mailto:{{ emailContact }}">{{ emailContact }}</a>
      </div>

      <!-- <footer class="flex justify-center gap-3">
      <button inviteModalClick class="btn btn-primary">Пригласить дизайнера</button>
    </footer> -->
    </section>

    <div class="border border-r-1 border-gray-200"></div>

    <div class="flex-1 flex flex-col gap-4">
      <header class="text-center flex flex-col gap-2 sm:gap-3">
        <h3 class="md:text-4xl text-3xl">Обратная связь</h3>
      </header>

      <form
        [formGroupStore]="'main-application-measurement'"
        class="flex flex-col gap-4 -w-120"
        [formGroup]="form"
        (submit)="formSubmit()"
      >
        <fieldset class="flex grid grid-cols-2 gap-3">
          <tui-textfield [tuiTextfieldCleaner]="false">
            <label tuiLabel>Введите имя</label>
            <input tuiInput formControlName="name" [maxlength]="100" />
          </tui-textfield>

          <tui-textfield [tuiTextfieldCleaner]="false">
            <label tuiLabel>Ваш Email</label>
            <input tuiInput formControlName="email" [maxlength]="100" />
          </tui-textfield>
        </fieldset>

        <tui-textfield [tuiTextfieldCleaner]="false">
          <label tuiLabel>Тема сообщения</label>
          <input tuiInput formControlName="theme" [maxlength]="100" />
        </tui-textfield>

        <tui-textfield [tuiTextfieldCleaner]="false">
          <label tuiLabel>Комментарий</label>
          <textarea tuiTextarea formControlName="description" [min]="2" [maxlength]="1000"></textarea>
        </tui-textfield>

        <footer>
          <button (click)="formSubmit()" class="btn btn-primary w-full">Отправить</button>
        </footer>
      </form>
    </div>
  </div>
</div>

<!-- <app-way-we-work id="way-we-work"></app-way-we-work> -->

<!--Footer-->
<app-main-footer></app-main-footer>
