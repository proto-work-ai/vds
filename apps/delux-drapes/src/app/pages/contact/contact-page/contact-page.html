<app-main-header></app-main-header>

<app-breadcrumbs-header [items]="breadcrumbs()" />

<div class="container mx-auto my-8 flex flex-col gap-4">
  <header class="text-center flex flex-col gap-2 sm:gap-3">
    <h2 class="md:text-2xl text-xl">Контакты</h2>
  </header>

  <section class="flex flex-wrap gap-4">
    <div class="w-1/3 flex flex-col gap-3">
      <h4 class="font-medium">Адрес</h4>
      <address>Москва, ул Нижняя Сыромятническая д 10с2 (этаж 6, помещение 624)</address>
    </div>

    <div class="w-1/3 flex flex-col gap-3">
      <h4 class="font-medium">Метро</h4>
      <p>Чкаловская — 860 м</p>
    </div>

    <div class="w-1/3 flex flex-col gap-3">
      <h4 class="font-medium">График работы</h4>

      <ul>
        <li>пн-чт : c 10.00 до 20.00</li>
        <li>пт-сб : с 10.00 до 18.00</li>
      </ul>
    </div>

    <div class="w-1/3 flex flex-col gap-3">
      <h4 class="font-medium">Телефон</h4>

      <ol>
        <li><a href="tel:+7{{ phoneContact }}">{{ phoneContact | phoneFormat }}</a>>/li></li>
        <li><a href="tel:+7{{ phoneContact }}">{{ phoneContact | phoneFormat }}</a></li>
      </ol>
    </div>

    <div class="w-1/3 flex flex-col gap-3">
      <h4 class="font-medium">Социальные сети</h4>

      <div class="flex gap-2">
        <a class="max-sm:text-sm" href="https://t.me/{{ telegramContact }}" target="_blank" alt="Telegram"
          ><img class="w-6 block text-white" src="/icons/telegram.svg" alt="Logotip"
        /></a>

        <a class="max-sm:text-sm" [href]="maxContact" target="_blank"
          ><img class="w-6 block" title="Max" src="/icons/max.svg" alt="Max"
        /></a>
      </div>
    </div>

    <!-- <footer class="flex justify-center gap-3">
      <button class="btn btn-primary">Пригласить дизайнера</button>
    </footer> -->
  </section>
</div>
