<app-main-header></app-main-header>

<app-breadcrumbs-header [items]="breadcrumbs()" />

<div class="container mx-auto my-8 flex flex-col gap-6">
  <header class="text-center flex flex-col gap-2 sm:gap-3">
    <h2 class="md:text-4xl text-2xl">{{ title() }}</h2>

    @if (text()) {
      <div class="md:w-175 mx-auto text-gray-500">
        От классики до сложных дизайнерских решений. Гарантируем быстрое производство, профессиональный монтаж,
        бесплатный замер.
      </div>
    }
  </header>

  <section class="flex flex-col gap-4">
    <div class="flex flex-col gap-3">
      <footer class="flex justify-center gap-3">
        <button [routerLink]="['/fabric']" class="btn btn-primary">Каталог тканей</button>

        <button inviteModalClick class="btn btn-primary">Пригласить дизайнера</button>
      </footer>
    </div>
  </section>
</div>

<section class="container mx-auto max-sm:px-5 md:my-8 my-6">
  <app-swiper-full-images [item]="item()" />
</section>
