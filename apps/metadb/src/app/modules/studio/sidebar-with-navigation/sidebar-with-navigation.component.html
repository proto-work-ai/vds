<div hlmSidebarWrapper>
  <hlm-sidebar class="bg-sidebar">
    <section hlmSidebarHeader>
      <brn-select
        class="inline-block"
        placeholder="Select schema"
        [formControl]="schemaControl"
      >
        <hlm-select-trigger class="w-56">
          <div class="flex gap-2">
            <span class="text-gray-500">Schema:</span>
            <hlm-select-value />
          </div>
        </hlm-select-trigger>

        <hlm-select-content []="true">
          @for (item of schemaOptions(); track item) {
            <hlm-option [value]="item.value">{{ item.title }}</hlm-option>
          }
        </hlm-select-content>
      </brn-select>
    </section>

    <section hlmSidebarContent>
      <!-- group -->
      <div hlmSidebarGroup>
        <div hlmSidebarGroupLabel class="flex gap-1">
          <ng-icon hlm name="lucideTable2" />
          Studio
        </div>

        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            @for (item of menuItems; track item) {
              <li hlmSidebarMenuItem>
                <a hlmSidebarMenuButton>
                  <ng-icon hlm [name]="item.icon" />
                  <span>{{ item.title }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      </div>

      <!-- tables -->
      <div hlmSidebarGroup>
        <div hlmSidebarGroupLabel class="flex gap-1">
          <ng-icon hlm name="lucideTable2" />
          Tables
        </div>

        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            @for (item of schemaTables; track item) {
              <li hlmSidebarMenuItem>
                <a hlmSidebarMenuButton>
                  <ng-icon hlm [name]="item.icon" />
                  <span>{{ item.title }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      </div>
    </section>
  </hlm-sidebar>

  <ng-content />
</div>
