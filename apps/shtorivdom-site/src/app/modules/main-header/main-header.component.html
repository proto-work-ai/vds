<div class="border-b-1 border-gray-200 bg-judge-gray text-white">
  <header class="md:container mx-auto py-2 flex flex-col gap-3 text-sm max-md:px-3">
    <section class="flex gap-4">
      <div class="flex-1 flex gap-2 items-center">
        <ng-icon name="lucideMail" class="text-lg" />
        <a class="text-base" href="mailto:{{ emailContact }}">{{ emailContact }}</a>
      </div>

      <div class="flex gap-2 items-center">
        <ng-icon name="lucidePhone" class="text-lg" />
        <a class="font-medium text-base" href="tel:+7{{ phoneContact }}">{{ phoneContact | phoneFormat }}</a>
      </div>

      <div class="flex gap-3">
        <a class="max-sm:text-sm" href="https://t.me/{{ telegramContact }}" target="_blank" alt="Telegram"
          ><img class="w-6 block text-white" src="/icons/telegram.svg" alt="Logotip"
        /></a>

        <a class="max-sm:text-sm" [href]="maxContact" target="_blank"
          ><img class="w-6 block" title="Max" src="/icons/max.svg" alt="Max"
        /></a>
      </div>
    </section>
  </header>
</div>

<app-nav-menu />
