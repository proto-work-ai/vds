<dialog
  #dialog
  class="cat-lb m-0 h-dvh w-screen max-h-none max-w-none border-0"
  aria-label="Просмотр фото"
  [class.is-open]="!!gallery.current()"
  (cancel)="gallery.close()"
  (close)="gallery.close()"
  (click)="$event.target === dialog && gallery.close()"
  (keydown)="key($event)"
  (touchstart)="touchStart($event)"
  (touchend)="touchEnd($event)"
>
  @if (gallery.current(); as image) {
    <button
      type="button"
      class="cat-lb-btn cat-lb-close"
      aria-label="Закрыть"
      (click)="gallery.close()"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
    @if (gallery.images().length > 1) {
      <button
        type="button"
        class="cat-lb-btn cat-lb-prev"
        aria-label="Предыдущее фото"
        (click)="gallery.move(-1)"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <button
        type="button"
        class="cat-lb-btn cat-lb-next"
        aria-label="Следующее фото"
        (click)="gallery.move(1)"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    }
    <figure>
      <img [src]="image.src" [alt]="image.alt" />
      <figcaption>
        {{ image.alt }}
        <span class="ml-2 text-gold">
          {{ gallery.index() + 1 }} / {{ gallery.images().length }}
        </span>
      </figcaption>
    </figure>
  }
</dialog>
