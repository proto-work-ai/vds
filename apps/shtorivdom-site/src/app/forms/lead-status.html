@if (lead().submitted()) {
  <div class="form-done py-8 text-center" role="status">
    <p class="mb-3 font-serif text-[30px] font-bold text-gold">Спасибо!</p>
    <p class="text-[14px] leading-relaxed text-current opacity-80">{{ lead().successMessage }}</p>
  </div>
} @else {
  @if (lead().error()) {
    <p class="mt-2 text-[12px] text-[#c0392b]" role="alert">
      {{ lead().error() }}
      <a class="underline" data-contact-link="phone"></a>
    </p>
  }
  @if (lead().submitting()) {
    <p class="mt-2 text-[14px]" role="status">Отправляем заявку…</p>
  }
}
