<div class="flex flex-col gap-5" [formGroup]="form()">
  <input
    type="text"
    formControlName="website"
    name="website"
    tabindex="-1"
    autocomplete="off"
    aria-hidden="true"
    class="absolute -left-[9999px] size-0 opacity-0"
  />
  @if (showName()) {
    <tui-textfield [tuiTextfieldCleaner]="false">
      <label tuiLabel>
        Имя
        <span class="text-red-600">*</span>
      </label>
      <input
        tuiTextfield
        formControlName="name"
        name="name"
        autocomplete="name"
        placeholder="Введите имя"
        class="field"
      />
    </tui-textfield>
  }
  @if (showCity()) {
    <tui-textfield [tuiTextfieldCleaner]="false">
      <label tuiLabel>Город</label>
      <input
        tuiTextfield
        formControlName="city"
        name="city"
        autocomplete="address-level2"
        placeholder="Город"
        class="field"
      />
    </tui-textfield>
  }
  <tui-textfield *appDefer [tuiTextfieldCleaner]="false">
    <label tuiLabel>
      Телефон
      <span class="text-red-600">*</span>
    </label>
    <input
      mask="+7 (###) ###-##-##"
      tuiInputPhone
      id="lead-phone"
      formControlName="phone"
      name="phone"
      type="tel"
      inputmode="tel"
      autocomplete="tel"
      placeholder="Укажите телефон"
      class="field"
      data-phone
    />
  </tui-textfield>
  <tui-textfield [tuiTextfieldCleaner]="false">
    <label tuiLabel>Комментарий</label>
    <textarea
      tuiTextarea
      id="lead-comment"
      formControlName="comment"
      placeholder="Комментарий"
      class="field resize-none"
      [rows]="3"
      [min]="3"
      [max]="6"
    ></textarea>
  </tui-textfield>
  <label class="flex items-start gap-3 text-[14px] leading-snug text-slate">
    <input
      tuiCheckbox
      type="checkbox"
      formControlName="consent"
      name="consent"
      class="mt-0.5 shrink-0"
      data-consent
      [size]="'m'"
    />
    <span>
      Я соглашаюсь с правилами по обработке
      <a
        routerLink="/soglasie-na-obrabotku-personalnyh-dannyh"
        class="text-navy underline decoration-gold underline-offset-2 hover:text-gold"
      >
        персональных данных
      </a>
    </span>
  </label>
</div>
